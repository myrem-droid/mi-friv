<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARCADE HUB | Minijuegos Originales</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Fondo animado con brillo sutil -->
    <div class="bg-glow"></div>

    <!-- Barra de Navegación Superior -->
    <nav class="navbar">
        <div class="logo">
            <span class="logo-icon">👾</span>
            <span class="logo-text">ARCADE<span class="accent">HUB</span></span>
        </div>

        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="buscador" placeholder="Buscar minijuego...">
        </div>

        <div class="stats-badge">
            <span id="contador-juegos">0</span> Juegos
        </div>
    </nav>

    <!-- Filtros por Categoría -->
    <div class="filtros-container">
        <button class="filtro-btn activo" data-categoria="todos">Todos</button>
        <button class="filtro-btn" data-categoria="favoritos">⭐ Favoritos</button>
        <button class="filtro-btn" data-categoria="accion">🔥 Acción</button>
        <button class="filtro-btn" data-categoria="arcade">🕹️ Arcade</button>
        <button class="filtro-btn" data-categoria="puzzle">🧩 Puzzle</button>
    </div>

    <!-- Cuadrícula Principal estilo Friv Pro -->
    <main class="contenedor-principal">
        <div id="grid-juegos" class="grid-juegos"></div>
        <div id="sin-resultados" class="sin-resultados oculto">
            <p>No se encontraron juegos con ese nombre 😢</p>
        </div>
    </main>

    <!-- Visor / Modal de Juego -->
    <div id="modal-juego" class="modal oculto">
        <div class="modal-contenido" id="modal-box">
            <div class="modal-barra">
                <div class="juego-info-barra">
                    <span id="icono-juego-actual" class="modal-icono">🎮</span>
                    <div>
                        <h2 id="titulo-juego-actual">Nombre del Juego</h2>
                        <span id="controles-juego-actual" class="controles-hint">PC: Flechas / Celular: Táctil</span>
                    </div>
                </div>
                <div class="modal-acciones">
                    <button id="btn-favorito-modal" class="btn-accion" title="Agregar a Favoritos">☆</button>
                    <button id="btn-reiniciar" class="btn-accion" title="Reiniciar Juego">↻</button>
                    <button id="btn-fullscreen" class="btn-accion" title="Pantalla Completa">⛶</button>
                    <button id="btn-cerrar" class="btn-accion btn-cerrar" title="Salir">✖</button>
                </div>
            </div>
            
            <div class="iframe-wrapper">
                <div id="loader" class="loader">Cargando juego...</div>
                <iframe id="iframe-juego" src="" frameborder="0" allowfullscreen allow="autoplay; fullscreen"></iframe>
            </div>
        </div>
    </div>

    <footer>
        <p>Desarrollado con ❤️ | 100% Jugable en PC y Móvil</p>
    </footer>

    <script src="juegos.js"></script>
</body>
</html>
